<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wolves">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script>window.HOW_CONFIG=window.HOW_CONFIG||{};window.HOW_LIVE=!!(window.HOW_CONFIG.supabaseUrl&&window.HOW_CONFIG.supabaseAnonKey);</script>
<title>House of Wolves — Gym App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--s1:#131315;--s2:#1b1b1e;--s3:#26262a;--line:#2d2d32;--ink:#f3f3f1;--ink2:#b6b6bb;--mute:#7a7a81;--accent:#f2f2f0;--accent-ink:#0a0a0b;--good:#3ecf8e;--warn:#f5b041;--bad:#ff6158;--r:14px;--hf:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;--bf:'Barlow',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink2)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
input[type=color]{padding:2px;height:42px;width:64px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin:12px 0}
label.f>span,.lbl{display:block;font-size:11px;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
h1,h2,h3{font-family:var(--hf);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:.95;font-weight:800}
a{color:inherit}
header.top{padding-top:max(10px,env(safe-area-inset-top));height:calc(58px + env(safe-area-inset-top));position:sticky;top:0;z-index:30;background:rgba(10,10,11,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}.brand>div{min-width:0}
.chart svg text{fill:var(--mute);font-size:11px;font-family:var(--bf)}
@media(max-width:600px){.hide-sm{display:none}}@media(min-width:601px){.show-sm{display:none}}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--hf);font-weight:900;font-size:14px;letter-spacing:.02em;overflow:hidden;flex:none}
.mark img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--hf);font-size:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;display:block;line-height:1;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-top:2px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto;flex:none}
.seg button{padding:6px 13px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
main{width:100%;max-width:760px;margin:0 auto;padding:16px 16px 110px}
.staff main{max-width:1180px;padding-bottom:60px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,14,16,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;max-width:140px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
nav.bottom button.on{color:var(--ink)}
nav.bottom svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:25;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shell{display:block}
.side{display:none}
@media(min-width:1000px){
 .staff .tabs{display:none}
 .staff .shell{display:grid;grid-template-columns:230px 1fr}
 .side{display:flex;flex-direction:column;gap:2px;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px)}
 .side button{text-align:left;padding:11px 14px;border-radius:10px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;align-items:center}
 .side button.on{background:var(--s2);color:var(--ink)}
 .side .badge{background:var(--s3);border-radius:999px;font-size:11px;padding:1px 7px}
}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--hf);font-size:36px;font-weight:800;line-height:1;margin-top:6px}
.kpi .l{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.kpi .d{font-size:12px;color:var(--mute);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--s3);border:1px solid var(--line);white-space:nowrap;line-height:1.1}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.g{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad);border-color:rgba(255,97,88,.4);background:transparent}
.btn.ok{color:var(--good);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--s3);color:var(--ink2);border:1px solid var(--line);white-space:nowrap;line-height:1.4}
.chip.good{color:var(--good);border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.08)}
.chip.warn{color:var(--warn);border-color:rgba(245,176,65,.35);background:rgba(245,176,65,.08)}
.chip.bad{color:var(--bad);border-color:rgba(255,97,88,.35);background:rgba(255,97,88,.08)}
.chip.inv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.muted{color:var(--mute)}.ink2{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:700}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb0{margin-bottom:0}
.h-sec{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:24px 0 10px}
.h-sec h2{font-size:26px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.day{flex:1;min-width:44px;padding:8px 0 7px;border-radius:12px;background:var(--s1);border:1px solid var(--line);text-align:center;position:relative}
.day small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.day b{font-family:var(--hf);font-size:22px;display:block;line-height:1.1}
.day.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.on small{color:inherit;opacity:.65}
.day.today:not(.on){border-color:var(--ink2)}
.day i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor}
.cls{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--tc,#888);border-radius:var(--r);margin-bottom:8px}
.cls.dim{opacity:.55}
.cls .t{font-family:var(--hf);font-size:24px;font-weight:800;width:60px;flex:none;line-height:1}
.cls .t small{display:block;font-family:var(--bf);font-size:11px;color:var(--mute);font-weight:600;margin-top:3px}
.cls .n{font-weight:700;font-size:15.5px}
.cls .m{flex:1;min-width:0;cursor:pointer}
.bar{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:3px}
.bar i.full{background:var(--warn)}
.wod section{padding:16px 0;border-top:1px solid var(--line)}
.wod section:first-child{border-top:0;padding-top:4px}
.wod .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700}
.wod h3{font-size:26px;margin:5px 0 9px}
.wod pre{white-space:pre-wrap;font-family:var(--bf);margin:0;font-size:16.5px;line-height:1.5;font-weight:500}
.scale{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:12px;font-size:13.5px;background:var(--s2);border-radius:10px;padding:10px 12px}
.scale b{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);padding-top:2px}
.notes{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);font-size:13.5px;color:var(--ink2)}
.notes b{color:var(--ink)}
.pct{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pct span{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px}
.pct span b{font-family:var(--hf);font-size:17px;margin-left:4px}
.lbr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lbr.me{background:linear-gradient(90deg,var(--s2),transparent);margin:0 -8px;padding:9px 8px;border-radius:8px}
.rank{width:22px;font-family:var(--hf);font-size:19px;color:var(--mute);text-align:center;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;border:1px solid var(--line);color:var(--ink2)}
.av.lg{width:52px;height:52px;font-size:17px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-family:var(--hf);font-size:20px;font-weight:800}
.hf{padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.hf.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ttabs button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);background:var(--s1)}
.ttabs button.on{border-color:var(--ink);color:var(--ink);background:var(--s2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:93vh;overflow:auto;padding:0 18px 28px;animation:up .22s ease;overscroll-behavior:contain}
.sheet.wide{max-width:900px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.scrim{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--s1);padding:16px 0 10px;z-index:2}
.sh h2{font-size:26px}
.foot{position:sticky;bottom:-28px;background:var(--s1);padding:12px 0 4px;margin-top:8px;display:flex;gap:8px;border-top:1px solid var(--line)}
.steps{display:flex;gap:4px;margin:0 0 14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.steps i.on{background:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--s3);font-weight:800;font-size:18px;border:1px solid var(--line)}
.stepper output{width:22px;text-align:center;font-family:var(--hf);font-size:20px}
.kitrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;line-height:1.4;cursor:pointer}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--s1)}
.opt:has(input:checked){border-color:var(--ink);background:var(--s2)}
.opt .pr{margin-left:auto;font-family:var(--hf);font-size:22px;white-space:nowrap;text-align:right}
.opt .pr small{display:block;font-family:var(--bf);font-size:11px;color:var(--mute)}
.yn{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.yn .seg{margin-left:0}
.yn label{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;padding:4px 8px;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--s2)}
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.empty{padding:26px 18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.hero{padding:20px 18px;border-radius:18px;background:radial-gradient(120% 140% at 100% 0%,var(--s3) 0%,var(--s1) 55%);border:1px solid var(--line);margin-bottom:12px;position:relative;overflow:hidden}
.hero h1{font-size:40px;margin-top:6px}
.hero .wolf{position:absolute;right:-18px;top:-6px;width:150px;opacity:.07;color:var(--ink)}
.lock{text-align:center;padding:30px 18px}
.lock h3{font-size:24px;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{padding:8px 6px;border-radius:10px;background:var(--s1);border:1px solid var(--line);text-align:center}
.slot b{font-family:var(--hf);font-size:18px;display:block}
.slot small{font-size:11px;color:var(--mute)}
.slot.past{opacity:.35}
.slot.full{border-color:rgba(245,176,65,.5)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3);display:block}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.pv{background:var(--s2);color:var(--ink2);font-size:12px;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.auth{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px}
.auth .logo{display:flex;align-items:center;gap:12px;margin:10px 0 26px}
.auth .logo .mark{width:52px;height:52px;font-size:19px;border-radius:14px}
.auth h1{font-size:44px}
.pass{text-align:center}
.pass .qrbox{width:240px;height:240px;margin:12px auto;background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center}
.pass .qrbox svg,.pass .qrbox img{width:100%;height:100%}
.pass .ring{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;width:240px;margin:0 auto}
.pass .ring i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:600;z-index:95;display:none;white-space:nowrap}
#toasts{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s ease;display:flex;gap:8px;align-items:flex-start}
.toast.bad{background:var(--bad);color:#fff}
.toast.good{background:var(--good);color:#04140c}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s2);margin-bottom:10px;font-size:14px}
.notice.warn{border-color:rgba(245,176,65,.45)}
.notice .grow b{display:block;margin-bottom:2px}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.ttgrid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.ttcol h3{font-size:18px;margin-bottom:8px}
.ttitem{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--tc);margin-bottom:6px;font-size:13px}
.ttitem b{font-family:var(--hf);font-size:17px;display:block}
.sec-ed{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--s2)}
.sec-ed input,.sec-ed select,.sec-ed textarea{background:var(--s1)}
.g-ed{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.swatch{width:38px;height:38px;border-radius:10px;border:2px solid var(--line)}
.swatch.on{border-color:var(--ink);outline:2px solid var(--bg);outline-offset:-4px}
.meter{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
.meter .bar{flex:1;margin:0}
.qr{width:180px;height:180px;margin:10px auto;background:#fff;border-radius:12px;padding:12px}
#tv{position:fixed;inset:0;z-index:90;background:#000;color:#fff;overflow:auto;display:none;padding:3vh 3vw}
#tv.on{display:block}
.tvg{display:grid;grid-template-columns:1.5fr 1fr;gap:3vw}
@media(max-width:800px){.tvg{grid-template-columns:1fr}}
#tv h1{font-size:clamp(40px,7vw,110px)}
#tv .wod pre{font-size:clamp(18px,2.2vw,34px)}
#tv .wod h3{font-size:clamp(26px,3vw,48px)}
#tv .lbr{font-size:clamp(16px,1.6vw,26px)}
.chart svg{width:100%;height:auto;display:block}
.chart .hit{fill:transparent;cursor:pointer}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.pipe h3{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between}
.lead{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.split{display:grid;gap:14px}
@media(min-width:1000px){.split{grid-template-columns:320px 1fr;align-items:start}}
</style>

  }
  // me: Jamie, unlimited, books Mon/Wed/Fri 17:15 + Tue hyrox-ish
  for(let d=-14;d<=6;d++){
    const ds=ymd(add(T,d)),wd=wdOf(ds);
    const want=wd===0||wd===2||wd===4?'17:15':wd===5?'09:00':null;
    if(!want)continue;
    const inst=instancesFor(ds).find(i=>i.time===want);if(!inst)continue;
    const b=bk(inst.id);if(b.in.includes('m1'))continue;
    if(b.in.length>=inst.cap)b.in.pop();
    b.in.push('m1');if(inst.start<new Date())b.checked.push('m1');

    TRACKS.forEach(([tk])=>{const doc=S.prog[ds+'|'+tk];if(!doc)return;

function plan_og(m){return !!plan(m.plan).og}
function genScore(sec,f,r){
  const T={Fran:[170,520],Grace:[140,460],'Lone Wolf':[860,1320],'Wolf Pack':[1450,2100],'Compromised Running':[1250,1750],'Half Sim':[1900,2950]};
  if(sec.score==='time'){const[a,b]=T[sec.title]||[400,1200];const s=b-(b-a)*Math.min(1,f*.9)+(r()-.5)*(b-a)*.25;return dur(Math.max(a,Math.min(b,s)))}
  if(sec.score==='rounds'){const R=sec.title==='Cindy'?[11,24]:[4,9];return Math.round(R[0]+(R[1]-R[0])*f*.85+r()*2)+'+'+Math.floor(r()*25)}
  if(sec.score==='load')return String(Math.round(70*f*(0.9+r()*.3)/2.5)*2.5);
  return String(Math.round(50+r()*100));
}
function tpl(){const L=[];let i=0;const A=(day,time,type,coach,cap)=>L.push({id:'t'+(++i),day,time,type,coach,cap:cap||TYPES[type].cap});
  for(let d=0;d<5;d++){A(d,'06:15','wod','Huw');A(d,'09:30','wod','Kirsty');A(d,'12:15','wod','Rachael');A(d,'17:15','wod','Kanisha');
    if(d<4)A(d,'18:15',d===1?'hyrox':'wod',d===1?'Gavin':'Mike');
    if(d===0||d===2)A(d,'19:15','gym','Rachael');if(d===1||d===3)A(d,'19:15','barbell','Andun');}
  A(5,'09:00','partner','Andun');A(5,'10:15','wod','Kanisha');A(6,'09:00','hyrox','Gavin');return L}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1&&s.seedWeek===ymd(mon(t0()))){S=s;return}if(s&&s.brand){seed(s.brand);return}}}catch(e){}
  seed();
}

/* ============ DOMAIN ============ */
const member=id=>S.members.find(m=>m.id===id);
const me=()=>member(S.meId)||S.members[0];
function instancesFor(ds){
  const wd=wdOf(ds);
  return S.template.filter(t=>t.day===wd).sort((a,b)=>tm(a.time)-tm(b.time)).map(t=>{const id=ds+'_'+t.id,o=S.overrides[id]||{};
    return {id,date:ds,time:t.time,type:t.type,coach:o.coach||t.coach,cap:t.cap,cancelled:!!o.cancelled,reason:o.reason||'',tid:t.id,start:at(ds,t.time)}});
}
function findInst(id){return instancesFor(id.slice(0,10)).find(i=>i.id===id)}
function bk(id){return S.bookings[id]||(S.bookings[id]={in:[],wait:[],checked:[],late:[]})}
function weekUsed(mid,ds,excl){const ws=mon(pd(ds));let n=0;for(let d=0;d<7;d++){const x=ymd(add(ws,d));instancesFor(x).forEach(i=>{if(i.id===excl)return;const b=S.bookings[i.id];if(b&&(b.in.includes(mid)||b.late.includes(mid)))n++})}return n}
function canBook(m,inst,ignoreTime){
  const p=plan(m.plan);
  if(inst.cancelled)return{ok:false,r:'Cancelled'};
  if(!ignoreTime&&inst.start<new Date())return{ok:false,r:'Started'};
  if(!ignoreTime&&daysBetween(TODAY(),inst.date)>S.cfg.ahead)return{ok:false,r:'Opens '+fmtD(ymd(add(pd(inst.date),-S.cfg.ahead)),{weekday:'short',day:'numeric'})};
  if(m.status==='frozen')return{ok:false,r:'Membership frozen'};
  if(m.status&&m.status!=='active')return{ok:false,r:m.status==='past_due'?'Payment overdue':m.status==='pending'?'Finish joining first':'No active membership',up:true};
  if(!p.tracks.includes(inst.type))return{ok:false,r:'Not on your plan',up:true};
  if(p.pack){if(m.credits<=0)return{ok:false,r:'No credits left',up:true};if(m.creditsExp<inst.date)return{ok:false,r:'Credits expire first',up:true}}
  if(p.perWeek&&weekUsed(m.id,inst.date,inst.id)>=p.perWeek)return{ok:false,r:p.perWeek+'/week used',up:true};
  return{ok:true};
}
function notify(mid,text){S.notifs.push({mid,text,at:new Date().toISOString(),read:false})}
function logA(t){S.log.unshift({t,at:new Date().toISOString()});S.log=S.log.slice(0,60)}
function book(id,mid,staff){
  const inst=findInst(id),m=member(mid),b=bk(id);
  if(b.in.includes(mid)||b.wait.includes(mid))return;
  const c=canBook(m,inst,staff);
  if(!c.ok&&!staff){toast(c.r,'bad');return}
  const p=plan(m.plan);
  if(b.in.length>=inst.cap&&!staff){b.wait.push(mid);toast(`You're #${b.wait.length} on the waitlist. You'll be booked in automatically if a space opens.`);logA(`${m.name} joined waitlist · ${TYPES[inst.type].name} ${inst.time}`)}
  else{b.in.push(mid);if(p.pack&&m.credits>0)m.credits--;b.late=b.late.filter(x=>x!==mid);
    if(!staff)toast(`Booked: ${TYPES[inst.type].name}, ${fmtD(inst.date)} ${inst.time}`,'good');logA(`${m.name} booked ${TYPES[inst.type].name} ${fmtD(inst.date)} ${inst.time}`)}
  save();render();
}
function cancelBk(id,mid,staff){
  const inst=findInst(id),m=member(mid),b=bk(id),p=plan(m.plan);
  if(b.wait.includes(mid)){b.wait=b.wait.filter(x=>x!==mid);toast('Removed from waitlist');save();render();return}
  const hrs=(inst.start-new Date())/36e5,late=!staff&&hrs<S.cfg.lateHrs;
  b.in=b.in.filter(x=>x!==mid);b.checked=b.checked.filter(x=>x!==mid);
  if(late){b.late.push(mid);toast(`Late cancel (under ${S.cfg.lateHrs}h). This still counts as a used class.`,'bad')}
  else{if(p.pack)m.credits++;if(!staff)toast('Cancelled. No charge.')}
  logA(`${m.name} ${late?'late-':''}cancelled ${TYPES[inst.type].name} ${fmtD(inst.date)} ${inst.time}`);
  if(S.cfg.autoPromote)promote(inst);
  save();render();
}
function promote(inst){
  const b=bk(inst.id);
  while(b.in.length<inst.cap&&b.wait.length){
    const nx=b.wait.shift(),m=member(nx),c=canBook(m,inst);
    if(!c.ok){notify(nx,`A space opened in ${TYPES[inst.type].name} ${inst.time} but you couldn't be booked (${c.r}).`);continue}
    b.in.push(nx);if(plan(m.plan).pack)m.credits--;
    notify(nx,`You're in! Moved off the waitlist for ${TYPES[inst.type].name}, ${fmtD(inst.date)} ${inst.time}.`);
    logA(`${m.name} promoted from waitlist · ${inst.time}`);
    if(UI.role==='staff'||nx===S.meId)toast(`${nx===S.meId?'You were':m.first+' was'} promoted from the waitlist`,'good');
  }
}
function visits(mid){
  const v=new Set(S.hist[mid]||[]);
  for(const [id,b] of Object.entries(S.bookings))if(b.checked.includes(mid))v.add(id.slice(0,10));
  S.og.forEach(o=>{if(o.mid===mid&&(o.status==='in'||o.status==='done'))v.add(o.date)});
  return [...v].sort();
}
function lastVisit(mid){const v=visits(mid);return v.length?v[v.length-1]:null}
function myUpcoming(mid=S.meId){
  const out=[],n=new Date();
  for(let d=0;d<=S.cfg.ahead+7;d++){const ds=ymd(add(t0(),d));instancesFor(ds).forEach(i=>{const b=S.bookings[i.id];if(!b)return;const end=new Date(i.start.getTime()+60*6e4);if(end<n)return;
    if(b.in.includes(mid))out.push({...i,st:'in'});else if(b.wait.includes(mid))out.push({...i,st:'wait',pos:b.wait.indexOf(mid)+1})})}
  return out;
}
function introEnd(m){return ymd(add(pd(m.start),30))}
function nextBill(m){const s=pd(m.start),n=t0();let d=new Date(n.getFullYear(),n.getMonth(),Math.min(s.getDate(),28));if(d<n)d=new Date(n.getFullYear(),n.getMonth()+1,Math.min(s.getDate(),28));return ymd(d)}
function mrr(){return S.members.filter(m=>m.status==='active'&&plan(m.plan).monthly).reduce((a,m)=>a+(m.plan==='intro'?100:plan(m.plan).price),0)}
function atRiskList(){const T=TODAY();return S.members.filter(m=>m.status==='active'&&daysBetween(m.start,T)>21).map(m=>({m,lv:lastVisit(m.id)})).filter(x=>!x.lv||daysBetween(x.lv,T)>=14).sort((a,b)=>(a.lv||'')<(b.lv||'')?-1:1)}
function visibleDoc(doc){if(!doc)return false;if(UI.role==='staff')return true;if(doc.status==='published')return true;if(doc.status==='scheduled'){const[d,t]=doc.release.split(' ');return new Date()>=at(d,t)}return false}
function parseScore(type,raw){
  raw=String(raw).trim();
  if(type==='time'){const m=raw.match(/^(\d+):(\d{1,2})$/);return m?+m[1]*60+ +m[2]:NaN}
  if(type==='rounds'){const m=raw.match(/^(\d+)(?:\+(\d+))?$/);return m?-(+m[1]*1000+(+m[2]||0)):NaN}
  const v=parseFloat(raw);return isNaN(v)?NaN:-v;
}
const DIVS=['Rx','Scaled','Foundations'];
function board(key,type,div){return (S.scores[key]||[]).filter(s=>s.div===div).map(s=>({...s,sv:parseScore(type,s.raw)})).filter(s=>!isNaN(s.sv)).sort((a,b)=>a.sv-b.sv)}
const fmtScore=(type,raw)=>type==='load'?raw+'kg':type==='rounds'?raw.replace('+',' + ')+(raw.includes('+')?'':' rds'):type==='reps'?raw+' reps':raw;
const fmtPR=p=>p.t==='time'?dur(p.v):p.t==='load'?p.v+'kg':p.t==='rounds'?p.v+' rds':p.v+' reps';
const round25=v=>Math.round(v/2.5)*2.5;
function pr(mid,k){const L=(S.prs[mid]||[]).filter(p=>p.k===k);return L.length?L.reduce((a,b)=>(b.t==='time'?b.v<a.v:b.v>a.v)?b:a):null}

/* ogym */
function ogWins(ds){return S.ogWin[wdOf(ds)]||[]}
function ogStarts(ds,d){const out=[];ogWins(ds).forEach(([a,b])=>{for(let t=tm(a);t+d<=tm(b);t+=30)out.push(hm(t))});return out}
function ogLoad(ds,startM,d,excl){
  const res={people:0,kit:{}};KIT.forEach(k=>res.kit[k.id]=0);
  for(let t=startM;t<startM+d;t+=30){
    let p=0;const k={};
    S.og.forEach(o=>{if(o.date!==ds||o.id===excl||o.status==='cancelled'||o.status==='done')return;const s=tm(o.start);if(s<=t&&t<s+o.dur){p++;Object.entries(o.kit||{}).forEach(([id,n])=>k[id]=(k[id]||0)+n)}});
    res.people=Math.max(res.people,p);Object.keys(res.kit).forEach(id=>res.kit[id]=Math.max(res.kit[id],k[id]||0));
  }
  return res;
}
function ogNow(){const ds=TODAY(),n=nowMin();return S.og.filter(o=>o.date===ds&&o.status==='in')}

function applyBrand(){
  const a=S.brand.accent||'#f2f2f0';const r=document.documentElement.style;r.setProperty('--accent',a);
  const h=a.replace('#','');const [R,G,B]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));
  r.setProperty('--accent-ink',(.2126*R+.7152*G+.0722*B)>.4?'#0a0a0b':'#ffffff');
}
function markHTML(){return `<div class="mark">${S.brand.logo?`<img src="${S.brand.logo}" alt="">`:'HOW'}</div>`}

function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},3600)}

/* sheet */
let SH=null;
function sheet(fn,...args){SH={fn,args};drawSheet()}
function drawSheet(){const root=$('#sheet');if(!SH){root.innerHTML='';document.body.style.overflow='';return}
  const r=SH.fn(...SH.args);const keep=$('#sheet .sheet');const st=keep?keep.scrollTop:0;
  root.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet ${r.wide?'wide':''}" role="dialog" aria-modal="true"><div class="sh"><h2>${r.title}</h2><button class="btn sm g" data-a="close" aria-label="Close">✕</button></div>${r.body}</div></div>`;
  document.body.style.overflow='hidden';const sh=$('#sheet .sheet');if(r.keepScroll)sh.scrollTop=st;r.mount&&r.mount(sh)}
function closeSheet(){SH=null;drawSheet()}

function planChip(m){const p=plan(m.plan);return `<span class="chip">${esc(p.name)}</span>`}
function usageChip(m){const p=plan(m.plan);
  if(m.status==='frozen')return `<span class="chip warn">Frozen until ${fmtD(m.frozenUntil,{day:'numeric',month:'short'})}</span>`;
  if(m.status==='pending')return `<span class="chip warn">Finish joining</span>`;
  if(m.status==='past_due')return `<span class="chip bad">Payment overdue</span>`;
  if(m.status==='cancelled'||p.id==='none')return `<span class="chip">No active membership</span>`;
  if(p.perWeek){const u=weekUsed(m.id,TODAY());return `<span class="chip ${u>=p.perWeek?'warn':''}">${u} of ${p.perWeek} this week</span>`}
  if(p.pack)return `<span class="chip ${m.credits<=1?'warn':''}">${m.credits} credit${m.credits===1?'':'s'} · exp ${fmtD(m.creditsExp,{day:'numeric',month:'short'})}</span>`;
  return `<span class="chip good">Unlimited${p.og?' + Open Gym':''}</span>`}
function dayStrip(sel,act,from,n=7,marks){
  let h='<div class="days">';for(let i=0;i<n;i++){const ds=ymd(add(from,i));
    h+=`<button class="day ${ds===sel?'on':''} ${ds===TODAY()?'today':''}" data-a="${act}" data-v="${ds}"><small>${DOW[wdOf(ds)]}</small><b>${pd(ds).getDate()}</b>${marks&&marks(ds)?'<i></i>':''}</button>`}
  return h+'</div>'}
function greet(){const h=new Date().getHours();return h<12?'Morning':h<17?'Afternoon':'Evening'}

function wodCard(ds,tk,o={}){
  const doc=S.prog[ds+'|'+tk];
  if(!doc)return `<div class="empty">${wdOf(ds)===6&&tk==='wod'?'Sunday: no CrossFit WoD. Hyrox at 09:00 and Open Gym after.':'No programming for this track today.'}</div>`;
  if(!o.staff&&!o.preview&&!visibleDoc(doc)){const[d,t]=doc.release.split(' ');return `<div class="card lock">${WOLF.replace('class="wolf"','style="width:48px;opacity:.5"')}<h3>Under wraps</h3><div class="muted">Programming drops ${fmtD(d,{weekday:'long'})} at ${t}.</div></div>`}
  const m=me();
  let h=`<div class="card wod">`;
  h+=doc.sections.map(sec=>{
    let s=`<section><div class="k">${esc(sec.kind)}</div><h3>${esc(sec.title)}</h3><pre>${esc(sec.body)}</pre>`;
    if(sec.lift&&/\d{2,3}\s*%/.test(sec.body)&&!o.tv){
      const pcts=[...new Set([...sec.body.matchAll(/(\d{2,3})\s*%/g)].map(x=>+x[1]))];
      const P=o.staff?null:pr(m.id,sec.lift);
      s+=P?`<div class="pct">${pcts.map(p=>`<span>${p}%<b>${round25(P.v*p/100)}kg</b></span>`).join('')}<span class="muted">from your ${P.v}kg 1RM</span></div>`
        :o.staff?'':`<div class="pct"><button class="btn xs" data-a="addPR" data-k="${esc(sec.lift)}">Add your ${esc(sec.lift)} 1RM to see your weights</button></div>`;
    }
    if(sec.rx||sec.sc||sec.fd)s+=`<div class="scale">${sec.rx?`<b>Rx</b><span>${esc(sec.rx)}</span>`:''}${sec.sc?`<b>Scaled</b><span>${esc(sec.sc)}</span>`:''}${sec.fd?`<b>Found.</b><span>${esc(sec.fd)}</span>`:''}</div>`;
    if((o.staff||o.tv)&&sec.notes&&!o.tv)s+=`<div class="notes"><b>Coach notes:</b> ${esc(sec.notes)}</div>`;
    if(sec.score!=='none'&&ds<=TODAY()&&!o.nolb)s+=lbBlock(ds,tk,sec,o);
    return s+'</section>'}).join('');
  return h+'</div>';
}
function lbBlock(ds,tk,sec,o){
  const key=ds+'|'+tk+'|'+sec.id;const all=S.scores[key]||[];const mine=all.find(s=>s.mid===S.meId);
  const div=UI.lbDiv;const rows=board(key,sec.score,div);

  h+=`<div class="row between"><span class="lbl" style="margin:0">Leaderboard · ${all.length} logged</span><div class="seg" style="margin:0">${DIVS.map(d=>`<button class="${d===div?'on':''}" data-a="lbDiv" data-v="${d}" style="padding:4px 10px;font-size:12px">${d==='Foundations'?'Found.':d}</button>`).join('')}</div></div>`;
  if(!rows.length)h+=`<div class="muted small" style="padding:12px 0">No ${div} scores yet.</div>`;
  h+=rows.slice(0,o.tv?12:o.full?99:8).map((s,i)=>{const mm=member(s.mid);if(!mm)return'';const isMe=s.mid===S.meId&&!o.staff;const hf=s.hf||[];const on=hf.includes(S.meId);
    return `<div class="lbr ${isMe?'me':''}"><span class="rank">${i+1}</span><span class="av">${ini(mm.name)}</span><div class="grow"><div class="b">${esc(mm.name)}${isMe?' (you)':''}</div>${s.note?`<div class="tiny muted">${esc(s.note)}</div>`:''}</div><span class="sc">${esc(fmtScore(sec.score,s.raw))}</span>${o.tv?'':`<button class="hf ${on?'on':''}" ${isMe||o.staff?'disabled':''} data-a="hf" data-k="${key}" data-m="${s.mid}" aria-label="High five">✋ ${hf.length||''}</button>`}</div>`}).join('');
  if(rows.length>8&&!o.full&&!o.tv)h+=`<button class="btn sm g block mt" data-a="fullLb" data-k="${key}" data-t="${sec.score}" data-ti="${esc(sec.title)}">See all ${rows.length}</button>`;
  return h+'</div>';

  const m=me(),n=new Date();
  let h=`<div class="hero">${WOLF}<div class="muted small">${fmtD(TODAY(),{weekday:'long',day:'numeric',month:'long'})}</div><h1>${greet()}, ${esc(m.first)}</h1><div class="row wrap" style="margin-top:12px;gap:6px">${planChip(m)} ${usageChip(m)}</div></div>`;

  const up=myUpcoming();
  if(up.length){const i=up[0];const b=bk(i.id);const mins=(i.start-n)/6e4;const canIn=i.st==='in'&&mins<=30&&mins>=-15&&!b.checked.includes(m.id);

/* ============ MEMBER: PROGRESS ============ */
function vProgress(){
  const m=me(),v=visits(m.id),T=TODAY();
  const month=v.filter(d=>d.slice(0,7)===T.slice(0,7)).length;
  let streak=0;for(let w=0;w<52;w++){const ws=add(mon(t0()),-w*7),we=add(ws,6);const has=v.some(d=>pd(d)>=ws&&pd(d)<=we);if(has)streak++;else if(w>0)break}
  let h=`<h2 style="font-size:30px;margin-bottom:12px">Progress</h2><div class="kpis"><div class="kpi"><div class="l">This month</div><div class="v">${month}</div><div class="d">sessions</div></div><div class="kpi"><div class="l">Week streak</div><div class="v">${streak}</div><div class="d">weeks training</div></div><div class="kpi"><div class="l">Last 12 weeks</div><div class="v">${v.filter(d=>daysBetween(d,T)<84).length}</div><div class="d">total sessions</div></div></div>`;
  const start=add(mon(t0()),-77);
  h+=`<div class="card"><div class="row between"><span class="lbl" style="margin:0">Attendance · last 12 weeks</span><span class="tiny muted">Mon → Sun</span></div><div class="heat mt">`;
  const vs=new Set(v);for(let i=0;i<84;i++){const d=ymd(add(start,i));h+=`<i class="${vs.has(d)?'on':''} ${d>T?'fut':''}" title="${fmtD(d)}${vs.has(d)?' · trained':''}"></i>`}
  h+=`</div></div>`;
  const P=S.prs[m.id]||[];
  const best=k=>pr(m.id,k);
  h+=`<div class="h-sec"><h2>Lifts</h2><button class="btn sm" data-a="addPR">+ Log a PR</button></div><div class="card">${LIFTS.map(l=>{const b=best(l);return `<div class="lbr" data-a="pctCalc" data-k="${esc(l)}" style="cursor:pointer"><div class="grow b">${l}</div>${b?`<span class="tiny muted">${fmtD(b.d,{day:'numeric',month:'short',year:'2-digit'})}</span><span class="sc">${b.v}kg</span>`:'<span class="muted small">Add 1RM</span>'}<span class="muted">›</span></div>`}).join('')}</div>`;
  h+=`<div class="h-sec"><h2>Benchmarks</h2></div><div class="card">${BENCH.map(([k])=>{const b=best(k);return `<div class="lbr"><div class="grow b">${k}</div>${b?`<span class="tiny muted">${fmtD(b.d,{day:'numeric',month:'short',year:'2-digit'})}</span><span class="sc">${fmtPR(b)}</span>`:`<button class="btn xs g" data-a="addPR" data-k="${esc(k)}">Add</button>`}</div>`}).join('')}</div>`;
  const recent=Object.entries(S.scores).flatMap(([k,arr])=>arr.filter(s=>s.mid===m.id).map(s=>({k,s}))).sort((a,b)=>a.k<b.k?1:-1).slice(0,6);
  if(recent.length)h+=`<div class="h-sec"><h2>Recent scores</h2></div><div class="card">${recent.map(({k,s})=>{const[d,tk,sid]=k.split('|');const sec=(S.prog[d+'|'+tk]?.sections||[]).find(x=>x.id===sid);return sec?`<div class="lbr"><div class="grow"><div class="b">${esc(sec.title)}</div><div class="tiny muted">${fmtD(d)} · ${s.div}</div></div><span class="sc">${esc(fmtScore(sec.score,s.raw))}</span></div>`:''}).join('')}</div>`;
  return h;
}
function shPR(k){

function shScore(key,type){
  const mine=(S.scores[key]||[]).find(s=>s.mid===S.meId);const raw=mine?mine.raw:'';
  let inp;
  if(type==='time'){const[a,b]=raw?raw.split(':'):['',''];inp=`<div class="row"><input name="a" inputmode="numeric" placeholder="min" value="${a}" required><span class="sc">:</span><input name="b" inputmode="numeric" placeholder="sec" value="${b||''}" required></div>`}

function barChart(series){
  const W=600,H=190,pl=30,pb=24,pt=10,max=Math.max(5,...series.map(s=>s.v));const nice=Math.ceil(max/10)*10;
  const bw=(W-pl)/series.length;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Check-ins per day, last 14 days">`;
  [0,nice/2,nice].forEach(t=>{const y=H-pb-(t/nice)*(H-pb-pt);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t}</text>`});
  series.forEach((s,i)=>{const x=pl+i*bw+2,w=bw-4,h=Math.max(0,(s.v/nice)*(H-pb-pt)),y=H-pb-h;const r=Math.min(4,w/2,h);
    g+=h>0?`<path d="M${x},${H-pb} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${H-pb} Z" fill="var(--accent)" opacity="${s.ds===TODAY()?.55:1}"/>`:'';
    if((series.length-1-i)%2===0)g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${DOW[wdOf(s.ds)].slice(0,2)} ${pd(s.ds).getDate()}</text>`;
    g+=`<rect class="hit" x="${pl+i*bw}" y="0" width="${bw}" height="${H}" data-tip="${fmtD(s.ds)} · ${s.v} check-ins${s.ds===TODAY()?' so far':''}"/>`});
  return `<div class="chart mt">${g}</svg></div>`;
}

function confirmInline(k){if(pending[k]&&Date.now()-pending[k]<4000){delete pending[k];return true}pending[k]=Date.now();toast(k==='reset'?'Tap again to reset all demo data':'Unsaved changes. Tap again to discard.');return false}
function kitStep(el,dlt){const f=el.closest('form');const k=el.dataset.k;const inp=f['kit_'+k];const v=Math.max(0,+inp.value+dlt);inp.value=v;f.querySelector(`[data-o="${k}"]`).textContent=v;ogLive(f)}
function qr(seed){if(window.qrcode){try{const q=window.qrcode(0,'M');q.addData(String(seed));q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){}}let h=0;for(const c of seed+'how')h=(h*31+c.charCodeAt(0))>>>0;const r=rng(h),n=21;let s=`<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" shape-rendering="crispEdges">`;
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()<.5)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`}
  return s+fin(0,0)+fin(14,0)+fin(0,14)+'</svg>'}

/* ============ FORMS ============ */
const FORMS={
 og:f=>{const m=me(),ds=f.date.value,s=f.start.value,d=+f.dur.value,edit=f.edit.value;
   if(!s)return toast('Pick a start time','bad');
   if(!f.c1.checked||!f.c2.checked||!f.c3.checked)return toast('Please confirm the three safety checks','bad');
   const L=ogLoad(ds,tm(s),d,edit||null);if(L.people>=S.cfg.ogCap)return toast('That slot is full','bad');
   const kit={};for(const k of KIT){const n=+f['kit_'+k.id].value;if(n>k.q-L.kit[k.id])return toast(`Not enough ${k.n} free for that slot`,'bad');if(n)kit[k.id]=n}
   const clash=S.og.find(o=>o.mid===m.id&&o.date===ds&&o.id!==edit&&o.status==='booked');if(clash&&!edit)return toast('You already have Open Gym booked that day','bad');
   const data={date:ds,start:s,dur:d,focus:f.focus.value,plan:f.plan.value.trim(),kit,injury:f.injury.value.trim(),buddy:f.buddy.value.trim()};
   if(edit)Object.assign(S.og.find(o=>o.id===edit),data);else S.og.push({id:uid(),mid:m.id,status:'booked',inAt:null,outAt:null,at:new Date().toISOString(),...data});
   logA(`${m.name} ${edit?'updated':'booked'} Open Gym ${fmtD(ds)} ${s}`);save();closeSheet();toast(`Open Gym ${edit?'updated':'booked'}: ${fmtD(ds)} ${s}–${hm(tm(s)+d)}`,'good');render()},
 score:f=>{const type=f.type.value,key=f.key.value;let raw;
   if(type==='time'){const a=+f.a.value,b=+f.b.value;if(isNaN(a)||isNaN(b)||b>59||f.a.value==='')return toast('Enter minutes and seconds','bad');raw=a+':'+pad(b)}
   else if(type==='rounds'){const a=parseInt(f.a.value),b=parseInt(f.b.value||'0');if(isNaN(a))return toast('Enter rounds','bad');raw=a+'+'+(b||0)}
   else{const a=parseFloat(f.a.value);if(isNaN(a))return toast('Enter a number','bad');raw=String(a)}
   const arr=S.scores[key]||(S.scores[key]=[]);const ex=arr.find(s=>s.mid===S.meId);const div=f.querySelector('[name=div]:checked').value;
   if(ex)Object.assign(ex,{raw,div,note:f.note.value.trim()});else arr.push({mid:S.meId,raw,div,note:f.note.value.trim(),hf:[]});
   const rank=board(key,type,div).findIndex(s=>s.mid===S.meId)+1;UI.lbDiv=div;
   save();closeSheet();toast(`Logged. You're #${rank} in ${div}.`,'good');render()},
 pr:f=>{const k=f.k.value,t=f.k.selectedOptions[0].dataset.t;let v;
   if(t==='time'){const m=f.v.value.match(/^(\d+):(\d{1,2})$/);if(!m)return toast('Use mm:ss for times','bad');v=+m[1]*60+ +m[2]}else{v=parseFloat(f.v.value);if(isNaN(v))return toast('Enter a number','bad')}
   const prev=pr(S.meId,k);(S.prs[S.meId]=S.prs[S.meId]||[]).push({k,v,t,d:f.d.value||TODAY()});
   const isPR=!prev||(t==='time'?v<prev.v:v>prev.v);save();closeSheet();toast(isPR?`🎉 New ${k} PR!`:`${k} logged`,'good');render()},
 editMe:f=>{const m=member(f.id.value);Object.assign(m,{name:f.name.value.trim(),first:f.name.value.trim().split(' ')[0],dob:f.dob.value,email:f.email.value.trim(),phone:f.phone.value.trim(),address:f.address.value.trim(),postcode:f.postcode.value.trim(),injuries:f.injuries.value.trim(),goals:f.goals.value.trim(),ec:{name:f.ecn.value.trim(),rel:f.ecr.value.trim(),phone:f.ecp.value.trim()}});
   save();toast('Details saved','good');if(UI.role==='staff')sheet(shMember,m.id);else closeSheet();render()},
 plan:f=>{const m=member(f.id.value),id=f.querySelector('[name=plan]:checked').value,p=plan(id);
   if(m.plan!==id){logA(`${m.name}: ${plan(m.plan).name} → ${p.name}`);m.plan=id;if(p.pack){m.credits=p.pack;m.creditsExp=ymd(add(t0(),p.valid))}}
   save();toast('Plan updated to '+p.name,'good');if(UI.role==='staff')sheet(shMember,m.id);else closeSheet();render()},
 freeze:f=>{const m=member(f.id.value);m.status='frozen';m.frozenUntil=f.until.value;
   for(const [id,b] of Object.entries(S.bookings)){if(id.slice(0,10)>=TODAY()&&id.slice(0,10)<=m.frozenUntil&&(b.in.includes(m.id)||b.wait.includes(m.id))){b.in=b.in.filter(x=>x!==m.id);b.wait=b.wait.filter(x=>x!==m.id);const i=findInst(id);if(i)promote(i)}}
   logA(`${m.name} froze until ${fmtD(m.frozenUntil)} (${f.why.value})`);save();toast('Frozen until '+fmtD(m.frozenUntil,{day:'numeric',month:'short'})+'. Bookings in that time were released.','good');if(UI.role==='staff')sheet(shMember,m.id);else closeSheet();render()},
 taster:f=>{const lid=UI.leadEdit;UI.leadEdit=null;let l=lid?S.leads.find(x=>x.id===lid):null;
   const data={name:f.name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),interest:f.interest.value,inst:f.inst.value||null,exp:f.exp.value};
   if(l)Object.assign(l,data,{status:data.inst?'booked':'new'});else S.leads.push(l={id:uid(),...data,status:data.inst?'booked':'new',created:TODAY(),src:UI.role==='staff'?'Walk-in':'Member referral'});
   logA(`Taster ${data.inst?'booked':'enquiry'}: ${data.name}`);save();closeSheet();toast(data.inst?`Taster booked for ${data.name}. Confirmation sent.`:'Lead added','good');render()},
 join:f=>{const J=UI.join,d=J.data,fd=new FormData(f);
   for(const k of new Set([...fd.keys()])){const all=fd.getAll(k);d[k]=k==='goals'||k==='times'?all:all[0]}
   if(J.step===3){d.goals=fd.getAll('goals');d.times=fd.getAll('times')}
   if(J.step===4){d.photo=f.photo.checked;d.mkt=f.mkt.checked;d.w1=f.w1.checked}
   if(J.step===5){const id='m'+(S.members.length+1)+uid().slice(0,3),p=plan(d.plan||'intro');const flag=PARQ.some((q,i)=>d['q'+i]==='y');d.flag=flag;
     S.members.push({id,name:(d.first+' '+d.last).trim(),first:d.first,plan:p.id,start:TODAY(),status:'active',email:d.email,phone:d.phone,dob:d.dob,address:d.address+', '+d.town,postcode:d.postcode,ec:{name:d.ecn,rel:d.ecr,phone:d.ecp},injuries:d.injuries||'',level:d.exp==='Never tried it'?'Beginner':'Intermediate',goals:(d.goals||[]).join(', ')||'—',credits:p.pack||0,creditsExp:ymd(add(t0(),p.valid||30)),waiver:true,parq:flag,notes:(d.times||[]).length?'Prefers: '+d.times.join(', '):'',frozenUntil:null,src:d.src||'—'});
     S.hist[id]=[];S.prs[id]=[];if(d.lead){const l=S.leads.find(x=>x.id===d.lead);if(l)l.status='joined'}
     notify(id,`Welcome to ${S.brand.name}, ${d.first}! Book your first class from the Classes tab.`);
     logA(`New member: ${d.first} ${d.last} (${p.name})`);S.meId=id;save()}
   J.step++;drawSheet();$('#sheet .sheet').scrollTop=0;render()},
 cancelCls:f=>{const id=f.id.value,i=findInst(id),b=bk(id);S.overrides[id]={...(S.overrides[id]||{}),cancelled:true,reason:f.why.value};
   [...b.in,...b.wait].forEach(mid=>{notify(mid,`${TYPES[i.type].name} ${fmtD(i.date)} ${i.time} is cancelled. ${f.why.value}`);const m=member(mid);if(plan(m.plan).pack&&b.in.includes(mid))m.credits++});
   const n=b.in.length;b.in=[];b.wait=[];logA(`Cancelled ${TYPES[i.type].name} ${i.time} · ${n} notified`);save();closeSheet();toast(`Class cancelled. ${n} members notified.`,'good');render()},
 tt:f=>{const id=f.id.value;const data={day:+f.day.value,time:f.time.value,type:f.type.value,coach:f.coach.value,cap:Math.max(1,+f.cap.value||16)};
   if(id)Object.assign(S.template.find(t=>t.id===id),data);else S.template.push({id:'t'+uid(),...data});save();closeSheet();toast('Timetable updated','good');render()},
 nudge:f=>{notify(f.id.value,f.msg.value);logA('Message sent to '+member(f.id.value).name);save();closeSheet();toast('Sent','good')},
 import:f=>{const lines=f.csv.value.trim().split(/\r?\n/).filter(Boolean);let n=0;
   lines.forEach((ln,i)=>{const c=ln.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(i===0&&/name/i.test(c[0]))return;if(!c[0])return;
     const p=PLANS.find(p=>c[3]&&(p.name.toLowerCase()===c[3].toLowerCase()||p.id===c[3].toLowerCase()))||PLANS[1];const id='m'+uid();
     S.members.push({id,name:c[0],first:c[0].split(' ')[0],plan:p.id,start:TODAY(),status:'active',email:c[1]||'',phone:c[2]||'',dob:'1990-01-01',address:'',postcode:'',ec:{name:'Not provided',rel:'',phone:''},injuries:'',level:'Intermediate',goals:'—',credits:p.pack||0,creditsExp:ymd(add(t0(),p.valid||30)),waiver:false,parq:false,notes:'Imported · needs waiver + emergency contact',frozenUntil:null,src:'Import'});
     S.hist[id]=[];S.prs[id]=[];n++});
   save();closeSheet();toast(`${n} member${n===1?'':'s'} imported. They'll be asked to sign the waiver on first login.`,'good');render()}
};

/* ============ CHANGE / INPUT HANDLERS ============ */
const CH={
 switchMe:el=>{S.meId=el.value;save();render();toast('Viewing as '+me().name)},
 coach:el=>{const id=el.dataset.v;S.overrides[id]={...(S.overrides[id]||{}),coach:el.value};save();toast('Coach updated');render()},
 memQ:el=>{UI.memQ=el.value;render();const q=$('#memQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},
 mNotes:el=>{member(el.dataset.v).notes=el.value;save();toast('Note saved')},
 ogWin:el=>{const d=+el.dataset.v;const w=el.value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>s.split('-').map(x=>x.trim()));
   if(w.some(x=>x.length!==2||!/^\d{1,2}:\d{2}$/.test(x[0])||!/^\d{1,2}:\d{2}$/.test(x[1])||tm(x[0])>=tm(x[1])))return toast('Use the format 10:30-12:00','bad');
   S.ogWin[d]=w.map(x=>x.map(t=>hm(tm(t))));save();toast('Open Gym hours saved','good');render()},
 pBench:el=>{if(el.value==='')return;const b=BENCHLIB[+el.value];UI.pe.doc.sections.push({id:uid(),...JSON.parse(JSON.stringify(b))});UI.pe.dirty=true;render()},
 bName:el=>{S.brand.name=el.value||'House of Wolves';save();render()},
 accent:el=>{S.brand.accent=el.value;save();render()},
 logo:el=>{const file=el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);S.brand.logo=c.toDataURL('image/png');save();render();toast('Logo updated','good')};img.src=rd.result};rd.readAsDataURL(file)},
 cfg:el=>{const k=el.dataset.v;S.cfg[k]=k==='release'?el.value:Math.max(0,+el.value);save();toast('Saved')},
 cfgB:el=>{S.cfg[el.dataset.v]=el.checked;save();toast('Saved')}
};

/* ============ WIRING ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.disabled)return;
  const fn=ACT[el.dataset.a];if(!fn)return;
  if(el.tagName==='BUTTON'||el.tagName==='A'||el.tagName==='TR'||el.tagName==='DIV'&&el.dataset.a!=='scrim')e.preventDefault();
  fn(el.dataset,el,e);
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();FORMS[f.dataset.f]&&FORMS[f.dataset.f](f)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.c&&el.dataset.c!=='memQ'&&CH[el.dataset.c]){CH[el.dataset.c](el);return}
  const f=el.closest('form[data-live="og"]');if(f)ogLive(f)});
let qT;document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.c==='memQ'){clearTimeout(qT);qT=setTimeout(()=>CH.memQ(el),180);return}
  if(el.dataset.pf&&UI.pe){const[i,k]=el.dataset.pf.split('.');UI.pe.doc.sections[+i][k]=el.value;if(!UI.pe.dirty){UI.pe.dirty=true}}
  if(el.dataset.pd&&UI.pe){UI.pe.doc.release=el.value.replace('T',' ');UI.pe.dirty=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#tv').classList.contains('on'))ACT.tvClose();else if(SH)closeSheet()}});

/* ============ DOOR PASS ============ */
let passTimer=null;
function loadQrLib(){return window.qrcode?Promise.resolve():new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.onload=r;s.onerror=r;document.head.appendChild(s)})}
function shPass(){
  const m=me();
  return {title:'Door pass',body:`<div class="pass"><div class="muted small">${esc(m.name)} · ${esc(plan(m.plan).name)}</div><div class="qrbox" id="passQr"><span class="muted">Loading…</span></div><div class="ring"><i id="passRing" style="width:100%"></i></div><div class="tiny muted mt">Hold this up to the scanner at the door. It refreshes every 30 seconds, so screenshots won't work.</div>
  ${window.HOW_LIVE?'<div class="foot"><button class="btn p block" data-a="openDoor">Open the door from here</button></div>':'<div class="tiny muted mt">Demo pass. In the live app the scanner checks your booking and opens the door.</div>'}</div>`,
  mount:()=>{clearInterval(passTimer);let left=30;const draw=async()=>{await loadQrLib();let tok='HOW1.demo.'+Math.floor(Date.now()/1000);if(window.HOW_LIVE&&window.Live){try{tok=await Live.doorToken()}catch(e){$('#passQr').innerHTML=`<span class="small" style="color:#000">${esc(e.message)}</span>`;return}}const el=$('#passQr');if(el)el.innerHTML=qr(tok);left=30};draw();passTimer=setInterval(()=>{if(!$('#passQr')){clearInterval(passTimer);return}left--;const r=$('#passRing');if(r)r.style.width=(left/30*100)+'%';if(left<=0)draw()},1000)}};
}

/* ============ INSTALL PROMPT ============ */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.HOW_INSTALL=e});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ============ INIT ============ */
if(!window.HOW_LIVE){
load();
S.members.forEach(m=>{if(m.status==='frozen'&&m.frozenUntil&&m.frozenUntil<TODAY()){m.status='active';m.frozenUntil=null}});
render();
setInterval(()=>{if(!SH&&!document.activeElement.matches('input,textarea,select'))render()},60000);
}
