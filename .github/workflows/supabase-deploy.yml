# Deploys the database changes and edge functions to Supabase.
# Needs (repo Settings > Secrets and variables > Actions):
#   Variable  SUPABASE_PROJECT_REF   e.g. abcdefghijklmnop (from the project URL)
#   Secret    SUPABASE_ACCESS_TOKEN  Supabase > Account > Access tokens
#   Secret    SUPABASE_DB_PASSWORD   the database password you set when creating the project
#   Secret    STRIPE_SECRET_KEY      sk_test_... first, then sk_live_... when ready (optional until then)
# Runs automatically when anything in supabase/ changes, or by hand from the Actions tab.
# A manual run also loads the starting data (plans, class types, kit, sample timetable).
name: Deploy Supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          fi
      - name: Set Stripe key
        if: ${{ env.STRIPE_KEY != '' }}
        run: supabase secrets set --project-ref "$PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_KEY"
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
